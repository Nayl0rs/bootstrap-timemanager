services:
  db:
    image: postgres:17
    container_name: timemanager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: timemanager
      POSTGRES_PASSWORD: timemanager_dev
      POSTGRES_DB: timemanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: